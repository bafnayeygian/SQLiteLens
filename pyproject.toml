[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-lens"
version = "1.0.0"
description = "Dependency-free read-only SQLite database inspector with JSON, Markdown, and Mermaid reports."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "SQLiteLens contributors"}
]
keywords = [
  "sqlite",
  "database",
  "schema",
  "inspection",
  "documentation",
  "mermaid",
  "cli",
  "developer-tools"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation"
]

[project.scripts]
sqlite-lens = "sqlite_lens.cli:main"

[project.urls]
Homepage = "https://github.com/bafnayeygian/SQLiteLens"
Issues = "https://github.com/bafnayeygian/SQLiteLens/issues"

[tool.setuptools.packages.find]
where = ["src"]
